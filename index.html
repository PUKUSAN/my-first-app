<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" aria-label="横スクロールアクションゲーム"></canvas>

    <header class="hud">
      <div class="title"><small>NIGHT SHIFT</small><strong>MOON RUNNER</strong></div>
      <div class="score-box">SCORE <span id="score">000000</span></div>
    </header>

    <p class="instructions"><kbd>←</kbd><kbd>→</kbd> 移動　 <kbd>SPACE</kbd> ジャンプ</p>

    <section id="result" class="result" aria-live="polite">
      <div class="result-panel">
        <h1 id="resultTitle">GAME OVER</h1>
        <p id="resultText">夜が明ける前に、もう一度走ろう。</p>
        <button id="nextStageButton" style="display: none;">STAGE2へ</button>
        <button id="restartButton">もう一度プレイ</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
